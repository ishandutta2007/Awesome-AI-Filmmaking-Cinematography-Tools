<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#0f1123" />
      <stop offset="100%" stop-color="#07070f" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="50%" stop-color="#9933ff" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ffcc00" />
    </linearGradient>

    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .film-strip {
        stroke: #2a2d4a;
        stroke-dasharray: 12, 8;
        animation: rollFilm 25s linear infinite;
      }
      @keyframes rollFilm {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 1000; }
      }
      .laser-pulse {
        animation: pulseLaser 4s ease-in-out infinite alternate;
      }
      @keyframes pulseLaser {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.85; transform: scale(1.02); }
      }
      .floating-orb1 {
        animation: floatOrb1 8s ease-in-out infinite alternate;
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0, 0); }
        100% { transform: translate(40px, -25px); }
      }
      .floating-orb2 {
        animation: floatOrb2 10s ease-in-out infinite alternate;
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0, 0); }
        100% { transform: translate(-30px, 30px); }
      }
      .waveform {
        animation: waveAnim 3s ease-in-out infinite alternate;
      }
      @keyframes waveAnim {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 80; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs in Background -->
  <g class="floating-orb1" opacity="0.25">
    <circle cx="200" cy="120" r="180" fill="#ff007f" filter="url(#glow)" />
  </g>
  <g class="floating-orb2" opacity="0.25">
    <circle cx="1020" cy="280" r="220" fill="#00e5ff" filter="url(#glow)" />
    <circle cx="600" cy="350" r="140" fill="#7928ca" filter="url(#glow)" />
  </g>

  <!-- Grid Pattern Overlay in Background -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Cinema Viewfinder Target Lines (Background / Framing) -->
  <g stroke="#4facfe" stroke-opacity="0.35" stroke-width="1.5">
    <!-- Top-Left Corner Bracket -->
    <path d="M 45 65 L 45 45 L 85 45" fill="none" />
    <!-- Top-Right Corner Bracket -->
    <path d="M 1155 65 L 1155 45 L 1115 45" fill="none" />
    <!-- Bottom-Left Corner Bracket -->
    <path d="M 45 355 L 45 375 L 85 375" fill="none" />
    <!-- Bottom-Right Corner Bracket -->
    <path d="M 1155 355 L 1155 375 L 1115 375" fill="none" />
    <!-- 2.39:1 Anamorphic Framing Guides -->
    <line x1="45" y1="105" x2="1155" y2="105" stroke-dasharray="8, 6" stroke-opacity="0.2" />
    <line x1="45" y1="315" x2="1155" y2="315" stroke-dasharray="8, 6" stroke-opacity="0.2" />
  </g>

  <!-- Dynamic Film Perforation Strip (Top & Bottom) -->
  <line x1="0" y1="20" x2="1200" y2="20" class="film-strip" stroke-width="8" />
  <line x1="0" y1="400" x2="1200" y2="400" class="film-strip" stroke-width="8" />

  <!-- Animated Lens Flare & Light Beam in Background -->
  <ellipse cx="600" cy="205" rx="480" ry="1" fill="#00d4ff" class="laser-pulse" filter="url(#lightGlow)" />

  <!-- Foreground Contents: Guaranteed Clean, Readable, and Never Hidden -->
  <g id="foreground-content">
    
    <!-- Camera Status Badges (Top Row) -->
    <g transform="translate(60, 58)">
      <!-- REC indicator -->
      <circle cx="8" cy="8" r="5" fill="#ff3366">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="22" y="12" fill="#ff3366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2">REC [24 FPS / 8K RAW]</text>
    </g>

    <g transform="translate(1005, 58)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="#1e2238" stroke="#33395c" stroke-width="1" />
      <text x="67" y="15" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AI CINEMA 2026</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome AI Filmmaking &amp; Cinematography
    </text>

    <!-- Gradient Bar Accent Under Title -->
    <rect x="360" y="188" width="480" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle (Always in Foreground) -->
    <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#b4c2dc">
      Curated Ecosystem of Generative Video, Camera Trajectory Control &amp; Virtual Studio Pipelines
    </text>

    <!-- Feature Pills / Badges in Foreground -->
    <g transform="translate(125, 275)">
      <!-- Pill 1: SaaS Leaders -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="165" height="34" rx="17" fill="#15192e" stroke="#2a3560" stroke-width="1.2" />
        <circle cx="18" cy="17" r="4" fill="#ff3366" />
        <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">SaaS Suites</text>
      </g>

      <!-- Pill 2: Open-Weight Models -->
      <g transform="translate(185, 0)">
        <rect x="0" y="0" width="195" height="34" rx="17" fill="#15192e" stroke="#2a3560" stroke-width="1.2" />
        <circle cx="18" cy="17" r="4" fill="#9933ff" />
        <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Open-Weight DiTs</text>
      </g>

      <!-- Pill 3: Camera Control -->
      <g transform="translate(400, 0)">
        <rect x="0" y="0" width="190" height="34" rx="17" fill="#15192e" stroke="#2a3560" stroke-width="1.2" />
        <circle cx="18" cy="17" r="4" fill="#00d4ff" />
        <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">6-DoF Camera Ctrl</text>
      </g>

      <!-- Pill 4: Character Consistency -->
      <g transform="translate(610, 0)">
        <rect x="0" y="0" width="200" height="34" rx="17" fill="#15192e" stroke="#2a3560" stroke-width="1.2" />
        <circle cx="18" cy="17" r="4" fill="#ffcc00" />
        <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Multi-Shot Consistency</text>
      </g>

      <!-- Pill 5: Local ComfyUI & NLE -->
      <g transform="translate(830, 0)">
        <rect x="0" y="0" width="120" height="34" rx="17" fill="#15192e" stroke="#2a3560" stroke-width="1.2" />
        <circle cx="18" cy="17" r="4" fill="#10b981" />
        <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Local NLE</text>
      </g>
    </g>

    <!-- Bottom Metadata Specs -->
    <g transform="translate(60, 355)">
      <text x="0" y="0" fill="#627293" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">ISO 800 • 35mm T1.5 • 2.39:1 Scope • 3D Spatial Conditioning</text>
      <text x="1080" y="0" text-anchor="end" fill="#627293" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">GitHub Awesome Curated List</text>
    </g>

  </g>
</svg>
